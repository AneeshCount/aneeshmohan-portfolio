name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # Publishing depends on this, so a failing lint, test, content rule or
  # build check cannot reach a-niche.com.
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publish the exact build that was verified rather than a second build
      # that might not be identical.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: a-niche.com
